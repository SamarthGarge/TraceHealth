version: "3.9"

services:
  auth-service:
    build: ./auth-service
    ports:
      - "4000:4000"
    env_file:
      - ./auth-service/.env

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./models:/app/models
    depends_on:
      - auth-service

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
      - auth-service

# MongoDB is expected to be a managed Atlas cluster, shared by auth-service and
# backend (see each service's .env MONGO_URI). A local mongo service can be
# added here for offline development if preferred.
