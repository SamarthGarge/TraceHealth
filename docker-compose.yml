version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./models:/app/models

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

# MongoDB is a managed Atlas cluster (see backend/.env → MONGO_URI).
# A local mongo service can be added here for offline development if preferred.
