name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # Required by Vite build — points to local API during CI
      VITE_API_BASE_URL: "http://localhost:8000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true   # non-blocking until all lint errors are resolved

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build
